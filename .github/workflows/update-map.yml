name: Update AOL Course Map

on:
  workflow_dispatch:
  schedule:
    - cron: "00 10 * * *"

permissions:
  contents: write
jobs:
  update-map:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch latest courses
        run: python fetch_all_india_hp.py

      - name: Prepare map data
        run: python prepare_map_ready_courses.py

      - name: Apply manual location fixes
        run: python merge_manual_locations.py

      - name: Prepare public website folder
        run: |
          mkdir -p website
          cp index.html website/index.html
          cp courses_for_map_final.json website/courses_for_map_final.json
          cp ashrams.json website/ashrams.json

      - name: Get course count
        id: course_count
        shell: bash
        run: |
          COUNT=$(python -c "import json; print(len(json.load(open('website/courses_for_map_final.json', encoding='utf-8'))))")
          UPDATED_AT=$(TZ='Asia/Kolkata' date '+%d %b %Y, %I:%M %p IST')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "updated_at=$UPDATED_AT" >> "$GITHUB_OUTPUT"

      - name: Send update email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: AOL Course Map Updated - ${{ steps.course_count.outputs.count }} courses
          to: ${{ secrets.MAIL_TO }}
          from: AOL Course Map Bot <${{ secrets.MAIL_USERNAME }}>
          body: |
            Course map updated successfully.

            Current courses: ${{ steps.course_count.outputs.count }}
            Updated at: ${{ steps.course_count.outputs.updated_at }}

            Website:
            https://aol-course-map.pages.dev

      - name: Commit updated website data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add website/index.html website/courses_for_map_final.json website/ashrams.json
          git commit -m "Auto update map data" || echo "No changes to commit"
          git push