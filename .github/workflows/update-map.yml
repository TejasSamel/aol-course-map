name: Update AOL Course Map

on:
  workflow_dispatch:
  schedule:
    # Every 3 hours from 6 AM to 9 PM India time
    # Plus one late-night run at 11:59 PM India time
    # GitHub cron uses UTC.
    - cron: "30 0,3,6,9,12,15 * * *"
    - cron: "29 18 * * *"

permissions:
  contents: write

jobs:
  update-map:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch latest courses
        run: python fetch_all_india_hp.py

      - name: Prepare map data
        run: python prepare_map_ready_courses.py

      - name: Apply manual location fixes
        run: python merge_manual_locations.py

      - name: Prepare public website folder
        run: |
          mkdir -p website
          cp index.html website/index.html
          cp courses_for_map_final.json website/courses_for_map_final.json
          cp ashrams.json website/ashrams.json

	      - name: Get course count
        id: course_count
        shell: bash
        run: |
          COUNT=$(python - <<'PY'
import json
from datetime import datetime
from zoneinfo import ZoneInfo

with open("website/courses_for_map_final.json", "r", encoding="utf-8") as f:
    data = json.load(f)

now = datetime.now(ZoneInfo("Asia/Kolkata")).strftime("%d %b %Y, %I:%M %p IST")

print(f"count={len(data)}")
print(f"updated_at={now}")
PY
          )
          echo "$COUNT" >> "$GITHUB_OUTPUT"

      - name: Send update email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: AOL Course Map Updated - ${{ steps.course_count.outputs.count }} courses
          to: ${{ secrets.MAIL_TO }}
          from: AOL Course Map Bot <${{ secrets.MAIL_USERNAME }}>
          body: |
            Course map updated successfully.

            Current courses: ${{ steps.course_count.outputs.count }}
            Updated at: ${{ steps.course_count.outputs.updated_at }}

            Website:
            https://aol-course-map.pages.dev

      - name: Commit updated website data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add website/index.html website/courses_for_map_final.json website/ashrams.json
          git commit -m "Auto update map data" || echo "No changes to commit"
          git push